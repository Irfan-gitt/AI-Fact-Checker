<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- ✅ IMPORTANT for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fact Checker</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 20px auto;
      padding: 16px;
      background: #0f172a;
      color: #f1f5f9;
    }

    h1 {
      color: #06b6d4;
      margin-bottom: 20px;
      font-size: clamp(22px, 5vw, 28px);
    }

    p {
      font-size: clamp(14px, 4vw, 16px);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 16px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #06b6d4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0891b2;
    }

    .result {
      margin-top: 25px;
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.6;
      border: 1px solid #334155;
      font-size: 14px;
      word-break: break-word;
    }

    label {
      color: #94a3b8;
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
    }

    /* ✅ Extra mobile tweaks */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .result {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <h1>🔍 Fact Checker</h1>

  <p style="color: #64748b; margin-bottom: 20px;">
    Don't believe everything you read — let AI verify it 🤖
  </p>

  <form method="POST">
    {% csrf_token %}
    <label>Enter a claim to verify:</label>
    <input type="text" name="claim" placeholder="e.g. The earth is flat...">
    <button type="submit">Check Fact</button>
  </form>

  {% if result %}
  <div class="result" id="resultBox">{{ result }}</div>
  {% endif %}

  <script>
    const box = document.getElementById('resultBox');
    if (box) {
      box.innerHTML = box.innerHTML.replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" style="color: #06b6d4;">$1</a>'
      );
    }
  </script>

</body>

</html>
